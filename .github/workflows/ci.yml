name: CI

# 每次推送到 main、以及每个 PR：编译两个 flavor + 跑 JVM 单元测试。
# 单测全部在 :core（业务层）里；app 侧改成 assemble 两个变体，连清单/资源合并一起验。
# 打包发布在 release.yml 里，只有版本号是新的才会跑。
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# 同一个分支上重复触发时，取消上一次还没跑完的
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 编译与单元测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # build.gradle.kts 里是 jvmToolchain(21)，所以 CI 也必须是 JDK 21
      - name: 配置 JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # runner 自带 Android SDK（ANDROID_HOME + 已接受的 licenses）。
      # 注意平台包名带 minor 版本：compileSdk = 37 对应 packages 里的 platforms;android-37.0。
      # 故意不依赖第三方 setup-android action，少一层会过期的依赖。
      - name: 准备 Android SDK
        run: |
          set -uo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$sdk" ]; then
            echo "::error::runner 上没有 ANDROID_SDK_ROOT / ANDROID_HOME"
            exit 1
          fi
          echo "Android SDK: $sdk"
          echo "已装平台：$(ls "$sdk/platforms" 2>/dev/null | tr '\n' ' ')"
          sdkmanager="$(find "$sdk/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -n1)"
          if [ -z "$sdkmanager" ]; then
            echo "::warning::没找到 sdkmanager，交给 AGP 自己下载缺失组件"
            exit 0
          fi
          yes | "$sdkmanager" --sdk_root="$sdk" --licenses >/dev/null 2>&1 || true
          # rc / canary 版本要带 channel，AGP 9 用的 build-tools 就是 36.1.0-rc1 这类
          yes | "$sdkmanager" --sdk_root="$sdk" --channel=3 --licenses >/dev/null 2>&1 || true
          for pkg in "platforms;android-37.0" "build-tools;36.1.0-rc1" "build-tools;37.0.0"; do
            out="$("$sdkmanager" --sdk_root="$sdk" --channel=3 "$pkg" 2>&1)" || {
              echo "$out" | tail -n 5
              echo "::warning title=预装 $pkg 失败::$(echo "$out" | tail -n 3 | tr '\n' ' ' | cut -c1-300)"
            }
          done
          echo "装完后平台：$(ls "$sdk/platforms" 2>/dev/null | tr '\n' ' ')"
          echo "build-tools：$(ls "$sdk/build-tools" 2>/dev/null | tr '\n' ' ')"
          # 把关键环境写进注解，CI 挂了不看日志也能定位
          echo "::notice title=CI 环境::java=$(java -version 2>&1 | head -n1) | JAVA_HOME=${JAVA_HOME:-无} | SDK=$sdk | platforms=$(ls "$sdk/platforms" 2>/dev/null | tr '\n' ' ') | build-tools=$(ls "$sdk/build-tools" 2>/dev/null | tr '\n' ' ')"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v6

      # 不需要 TMDB_API_KEY：空值只影响运行时刮削，不影响编译与单测。
      # 注意：GitHub 默认 shell 自带 -e，这里必须 set +e，否则失败时来不及收集日志。
      # 失败时把原因写进运行摘要与注解，不看日志也能定位。
      - name: 编译并运行单元测试
        run: |
          set -uo pipefail
          set +e
          log="$RUNNER_TEMP/gradle.log"
          {
            ./gradlew --version
            # 注：加了 product flavor 之后没有 :app:testDebugUnitTest 这个任务了，
            # 变体任务名形如 testTvDebugUnitTest / assemblePhoneDebug。
            ./gradlew :core:testDebugUnitTest :app:assembleTvDebug :app:assemblePhoneDebug --console=plain
          } 2>&1 | tee "$log"
          status="${PIPESTATUS[0]}"
          if [ "$status" -ne 0 ]; then
            summary="$(awk '/What went wrong:/{f=1} f{print; if(++n>=8) exit}' "$log" | tr '\n' ' ' | tr -s ' ' | cut -c1-2000)"
            [ -n "$summary" ] || summary="$(grep -m1 -E 'FAILURE:|^> Task .* FAILED|Could not|Caused by:' "$log" | tr '\n' ' ' | cut -c1-2000)"
            {
              echo "## Gradle 失败"
              echo
              echo '**原因**：'"${summary:-未识别，见日志尾部}"
              echo
              echo '```'
              tail -n 60 "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Gradle 失败::${summary:-见运行摘要}"
            exit "$status"
          fi

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: |
            core/build/reports/tests/testDebugUnitTest
            core/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
